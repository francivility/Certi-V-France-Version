<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Bridge &middot; Capture Document</title>
  <style>
    html, body { margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0E2036;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      color: #0E2036;
      border-radius: 16px;
      padding: 28px 24px;
      margin: 16px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
    .title { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #5b6b79; margin: 0 0 20px; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #0E2036;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:disabled { opacity: .6; }
    #status { min-height: 20px; font-size: 13px; font-weight: 600; margin-top: 16px; }
    #status.ok { color: #166534; }
    #status.err { color: #b91c1c; }
    #retry { display: none; font-size: 12px; color: #5b6b79; margin: 10px 0 0; }
    input[type=file] { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <p class="title">QR Code Bridge</p>
    <p class="subtitle">Capture your document and it will appear on your computer screen.</p>
    <button class="btn" id="camBtn" type="button">Open Camera</button>
    <input type="file" id="file" accept="image/*" capture="environment">
    <p id="status"></p>
    <p id="retry">Want another document? Tap Open Camera again.</p>
  </div>
  <script>
    const code = '{{ code|escapejs }}';
    const camBtn = document.getElementById('camBtn');
    const file = document.getElementById('file');
    const status = document.getElementById('status');
    const retry = document.getElementById('retry');

    function show(msg, kind) {
      status.textContent = msg;
      status.className = kind || '';
    }

    camBtn.onclick = () => file.click();

    file.onchange = async () => {
      const f = file.files[0];
      if (!f) return;
      camBtn.disabled = true;
      retry.style.display = 'none';
      show('Sending to your computer…');
      const fd = new FormData();
      fd.append('image', f, f.name || 'capture.jpg');
      try {
        const res = await fetch('/api/applications/qr-bridge/upload/' + encodeURIComponent(code) + '/', {
          method: 'POST',
          body: fd,
        });
        if (!res.ok) throw new Error('upload failed');
        show('Sent ✓ It should appear on your computer now.', 'ok');
      } catch (e) {
        show('Upload failed. Please try again.', 'err');
      }
      camBtn.disabled = false;
      retry.style.display = 'block';
      file.value = '';
    };
  </script>
</body>
</html>
