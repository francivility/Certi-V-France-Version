<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certi-V &middot; Verification</title>
  <style>
    html, body { margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0E2036;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      color: #0E2036;
      border-radius: 16px;
      padding: 28px 24px;
      margin: 16px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
    .title { font-size: 17px; font-weight: 700; margin: 0 0 6px; }
    .msg { font-size: 14px; color: #5b6b79; line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <p class="title">Link no longer available</p>
    <p class="msg">
      This QR code has already been used or expired. Go back to your computer
      and scan a fresh QR code to restart verification.
    </p>
  </div>
</body>
</html>
